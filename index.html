<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wakuge — Link-in-Bio</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6 for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    
    <!-- Profile Header -->
    <header class="profile">
      <div class="avatar">
        <img src="https://uploads.onecompiler.io/454wh85u3/ai-1790884225585/7e218a5e188be2d69fe2a4f487760426.jpg" alt="Wakuge profile picture">
      </div>
      
      <h1 class="name">Wakuge</h1>
      <p class="bio">AI web designer &amp; creative coder</p>
      <span class="profile-tag"><span class="status-dot"></span> DESIGN · CODE · CREATE</span>
    </header>
    <!-- Links -->
    <nav class="links" aria-label="Social links">
      <!-- Telegram -->
      <a href="https://t.me/wakuge" 
         class="link-btn telegram" 
         target="_blank" 
         rel="noopener noreferrer">
        <span class="link-icon"><i class="fa-brands fa-telegram"></i></span>
        <span class="link-copy"><span class="link-title">Telegram</span><span class="link-subtitle">Send me a message</span></span>
        <i class="fa-solid fa-arrow-up-right-from-square link-arrow" aria-hidden="true"></i>
      </a>
      <!-- Discord -->
      <a href="https://discord.com/invite/sakurasikkkk" 
         class="link-btn discord" 
         target="_blank" 
         rel="noopener noreferrer">
        <span class="link-icon"><i class="fa-brands fa-discord"></i></span>
        <span class="link-copy"><span class="link-title">Discord Server</span><span class="link-subtitle">Join the community</span></span>
        <i class="fa-solid fa-arrow-up-right-from-square link-arrow" aria-hidden="true"></i>
      </a>
      <!-- YouTube -->
      <a href="https://www.youtube.com/@zeleenka99" 
         class="link-btn youtube" 
         target="_blank" 
         rel="noopener noreferrer">
        <span class="link-icon"><i class="fa-brands fa-youtube"></i></span>
        <span class="link-copy"><span class="link-title">YouTube Channel</span><span class="link-subtitle">Videos &amp; creative stuff</span></span>
        <i class="fa-solid fa-arrow-up-right-from-square link-arrow" aria-hidden="true"></i>
      </a>
    </nav>
    <!-- Footer -->
    <footer class="footer">
      © 2026 Wakuge
    </footer>
  </div>
